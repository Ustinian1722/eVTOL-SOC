name: WHEN report42 terminal duration consistency (22 VAH cells)

on:
  push:
    branches: [research/when-terminal-duration-identifiability-20261031]
  pull_request:
    branches: [research/when-raw-termination-audit-20261029]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-duration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.26' 'pandas>=2.2,<3'
      - name: Synthetic matching and duration audit tests
        run: |
          cd soc_drift_study/scripts
          python -m unittest -v test_raw_mission_termination test_terminal_duration_consistency
      - name: Materialize three LFS raw cells
        run: |
          git lfs install --local
          git lfs pull --include='VAH01.csv,VAH11.csv,VAH12.csv' --exclude=''
          for f in VAH01.csv VAH11.csv VAH12.csv; do test "$(wc -c < "$f")" -gt 1000000; done
      - name: Recompute original 22-cell raw terminal evidence
        run: |
          python -u soc_drift_study/scripts/audit_raw_mission_termination.py \
            --root . --out soc_drift_study/raw_terminal_audit_outputs --require-22
          python -u soc_drift_study/scripts/analyze_raw_terminal_patterns.py \
            --out soc_drift_study/raw_terminal_audit_outputs
          python -u soc_drift_study/scripts/audit_pre_mission_charge.py \
            --out soc_drift_study/raw_terminal_audit_outputs
      - name: Recompute report42 duration and terminal joint evidence
        run: |
          python -u soc_drift_study/scripts/audit_terminal_duration_consistency.py \
            --out soc_drift_study/raw_terminal_audit_outputs --require-22
      - name: Assert interpretation boundaries and output coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p=Path('soc_drift_study/raw_terminal_audit_outputs')
          d=pd.read_csv(p/'report42_duration_classification.csv')
          assert len(d)==20848 and d.cell_id.nunique()==22
          assert not d.independent_SOC_truth.any()
          assert not d.verified_cutoff_reason.any()
          assert int(d.joint_candidate.sum())==15
          assert (p/'report42.md').exists()
          PY
      - name: Publish Chinese report42
        run: cat soc_drift_study/raw_terminal_audit_outputs/report42.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: when-report42-terminal-duration-22cells
          path: |
            soc_drift_study/raw_terminal_audit_outputs/report42*
            soc_drift_study/raw_terminal_audit_outputs/mission_prior_charge_evidence.csv
            soc_drift_study/raw_terminal_audit_outputs/terminal_pattern_by_cell.csv
          retention-days: 30
          if-no-files-found: error
