name: Mission-Only SOC Drift and Adaptation Research

on:
  push:
    branches:
      - research/mission-only-active-adaptation-20261012
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-only-active-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    name: Mission-only 22-cell causal adaptation benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: soc_drift_study
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: soc_drift_study/requirements.txt
      - name: Install scientific stack
        run: python -m pip install -r requirements.txt
      - name: Synthetic and causality unit tests
        run: python -m unittest discover -s tests -p 'test_mission_only_adaptation.py' -v
      - name: Run N20 mission-only 22-cell experiments
        run: python scripts/mission_only_active_adaptation.py --output-dir mission_only_artifacts
      - name: Write research summary
        if: always()
        run: |
          if test -s mission_only_artifacts/report.md; then
            cat mission_only_artifacts/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload cell and policy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-only-soc-adaptation
          path: soc_drift_study/mission_only_artifacts/
          retention-days: 30
          if-no-files-found: warn
