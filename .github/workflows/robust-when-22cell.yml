name: Robust WHEN minimax cost/regret audit (archived 22-cell queue)

on:
  push:
    branches:
      - research/when-minimax-reference-quality-20261023
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy pandas
      - name: Download archived successful raw-VAH-derived causal-queue results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p soc_drift_study/robust_when_inputs
          gh run download 39102686653 --repo Ustinian1722/eVTOL-SOC \
            --name causal-queue-22cell-quality-results \
            --dir soc_drift_study/robust_when_inputs
          test -s soc_drift_study/robust_when_inputs/source_gate_grid.csv
          test -s soc_drift_study/robust_when_inputs/source_gate_choices.csv
          test -s soc_drift_study/robust_when_inputs/outer_22_cell_queue_gate.csv
      - name: Run source-only minimax cost and regret selection
        run: |
          python soc_drift_study/scripts/audit_robust_when_selection.py \
            --input soc_drift_study/robust_when_inputs \
            --out soc_drift_study/robust_when_outputs
      - name: Test physical-cell splits, invariance, and negative result
        run: |
          python soc_drift_study/scripts/test_robust_when_selection.py \
            --input soc_drift_study/robust_when_inputs
          python - <<'PY'
          import pandas as pd
          p='soc_drift_study/robust_when_outputs/'
          d=pd.read_csv(p+'source_only_robust_choices.csv')
          h=pd.read_csv(p+'heldout_robust_policy_cells.csv')
          s=pd.read_csv(p+'robust_policy_summary.csv')
          assert len(d)==30 and len(h)==3168 and len(s)==144
          q=s.query('budget==4 and price==0.1 and delay==0')
          def j(policy,noise):
              return float(q[(q.policy==policy)&(q.reference_noise==noise)].J_mean.iloc[0])
          assert abs(j('active','nominal')-1.954432)<1e-5
          assert abs(j('minimax_cost','capacity_plus5pct')-2.473909)<1e-5
          assert j('minimax_regret','capacity_plus5pct')>j('active','capacity_plus5pct')
          print('PASS: source-only, full 22-cell, robust-policy NO-GO')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robust-when-22cell-minimax-regret-audit
          path: soc_drift_study/robust_when_outputs/
          retention-days: 30
          if-no-files-found: warn
