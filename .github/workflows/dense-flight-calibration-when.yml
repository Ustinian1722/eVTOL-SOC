name: Dense Normal Flight Supervised SOC Calibration WHEN Pilot

on:
  push:
    branches: [research/dense-flight-calibration-when-v1-20261012]
  pull_request:
    branches: [research/active-maintenance-roi-and-curves-20261012]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dense-reference-when-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dense_curve:
    name: Four physical cells full-curve supervision; budgeted WHEN and Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: soc_drift_study
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: soc_drift_study/requirements.txt
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Synthetic strict causality and brute-force oracle
        run: python -m unittest discover -s tests -p 'test_dense_highrate_reference_maintenance.py' -v
      - name: Materialize original source VAH01 only
        working-directory: .
        run: |
          git lfs install --local
          git lfs pull --include="VAH01.csv" --exclude=""
          test "$(wc -c < VAH01.csv)" -gt 1000000
      - name: Evaluate true original-sample normal-task reference calibration
        run: |
          python -u scripts/dense_highrate_reference_maintenance.py \
            --cells VAH01 VAH02 VAH17 VAH27 \
            --output-dir dense_reference_maintenance_artifacts
      - name: Publish evidence
        if: always()
        run: |
          if test -s dense_reference_maintenance_artifacts/report.md; then
            cat dense_reference_maintenance_artifacts/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-flight-full-SOCproxy-reference-when
          path: soc_drift_study/dense_reference_maintenance_artifacts/
          retention-days: 30
          if-no-files-found: warn
