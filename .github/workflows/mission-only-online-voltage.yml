name: Online Mission Voltage Identification and SOC Transfer

on:
  push:
    branches:
      - research/mission-only-voltage-tta-20261012
  pull_request:
    branches:
      - research/mission-only-active-adaptation-20261012
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voltage-adapt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: soc_drift_study
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: soc_drift_study/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run 4 synthetic online timing tests
        run: python -m unittest discover -s tests -p 'test_mission_only_voltage.py' -v
      - name: Run measured high-rate voltage and SOC proxy comparisons
        run: python scripts/mission_only_online_voltage.py --output-dir online_voltage_artifacts
      - name: Summarize results
        if: always()
        run: |
          if test -s online_voltage_artifacts/report.md; then
            cat online_voltage_artifacts/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-only-online-voltage-audit
          path: soc_drift_study/online_voltage_artifacts
          retention-days: 30
          if-no-files-found: warn
